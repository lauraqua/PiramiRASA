version: "3.1"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

intents:
  - aiuto
  #- apri
  #- bevi
  - conferma
  #- gioca
  #- guarda
  - info
  - interagisci
  - lascia
  - nega
  #- parla
  - prendi
  - saluta
  #- usa
  - vai
  - chi_sono

entities: 
  - stanza
  - oggetto
  - personaggio
  - direzione

slots:
  game_state:
    type: any # GameState
    mappings:
      - type: custom
    initial_value: '{}'

responses:
  utter_aiuto:
    - text: "Puoi esplorare (vai), guardarti intorno o esaminare qualcosa (info), raccogliere (prendi), lasciare (lascia) o interagire con oggetti e personaggi."
  utter_action_inizia_gioco:
    - image: https://imgur.com/a/Te01NnW
      text: "Ciao! Questo è PiramiRASA e io sarò la tua guida."
  utter_chi_sono:
    - text: "Sei il ladro più ricercato d'Egitto. Sfuggito per un soffio al cacciatore di taglie Cassidy al Cairo, ti sei calato in una botola nascosta nella sabbia ed eccoti intrappolato qui dentro."
   

actions:
  - action_inizia_gioco
  - action_vai
  - action_interagisci
  - action_prendi
  - action_lascia
  - action_info